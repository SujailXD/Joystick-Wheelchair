<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="Circuit diagram of the 4 mecanum wheel version: joystick to Arduino Uno, Arduino to two L298N boards, each driving two motors, battery through a switch">
  <style>text{font-family:"JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace}</style>
  <rect width="1000" height="720" fill="#ffffff"/>

  <!-- ===== wires ===== -->
  <!-- joystick -> Arduino -->
  <line x1="200" y1="110" x2="290" y2="110" stroke="#1c2230" stroke-width="2.5"/>
  <line x1="200" y1="140" x2="290" y2="140" stroke="#c62828" stroke-width="2.5"/>
  <line x1="200" y1="170" x2="290" y2="170" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="290" y2="200" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="200" y1="230" x2="290" y2="230" stroke="#0e7490" stroke-width="2.5"/>
  <!-- Arduino -> front L298N -->
  <g stroke="#c2410c" stroke-width="2.5">
    <line x1="460" y1="100" x2="560" y2="100"/><line x1="460" y1="130" x2="560" y2="130"/><line x1="460" y1="160" x2="560" y2="160"/>
    <line x1="460" y1="190" x2="560" y2="190"/><line x1="460" y1="220" x2="560" y2="220"/><line x1="460" y1="250" x2="560" y2="250"/>
  <!-- Arduino -> rear L298N -->
    <line x1="460" y1="340" x2="560" y2="340"/><line x1="460" y1="370" x2="560" y2="370"/><line x1="460" y1="400" x2="560" y2="400"/>
    <line x1="460" y1="430" x2="560" y2="430"/><line x1="460" y1="460" x2="560" y2="460"/><line x1="460" y1="490" x2="560" y2="490"/>
  </g>
  <!-- L298N -> motors -->
  <g stroke="#7c3aed" stroke-width="2.5">
    <line x1="720" y1="100" x2="768" y2="100"/><line x1="720" y1="130" x2="768" y2="130"/>
    <line x1="720" y1="220" x2="768" y2="220"/><line x1="720" y1="250" x2="768" y2="250"/>
    <line x1="720" y1="340" x2="768" y2="340"/><line x1="720" y1="370" x2="768" y2="370"/>
    <line x1="720" y1="460" x2="768" y2="460"/><line x1="720" y1="490" x2="768" y2="490"/>
  </g>
  <!-- front L298N 5V -> Arduino 5V (top) -->
  <polyline points="590,70 590,52 420,52 420,60" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <!-- ground rail (x=900) -->
  <polyline points="690,70 690,40 900,40 900,640" fill="none" stroke="#1c2230" stroke-width="2.5"/>
  <polyline points="640,520 640,585 900,585" fill="none" stroke="#1c2230" stroke-width="2.5"/>
  <polyline points="375,560 375,612 900,612" fill="none" stroke="#1c2230" stroke-width="2.5"/>
  <circle cx="900" cy="585" r="4" fill="#1c2230"/><circle cx="900" cy="612" r="4" fill="#1c2230"/>
  <!-- 12V rail (x=940) with a hop over the ground rail -->
  <polyline points="640,70 640,22 940,22 940,598" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <path d="M690,520 L690,552 L893,552 A7,7 0 0 1 907,552 L940,552" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <circle cx="940" cy="552" r="4" fill="#c62828"/>
  <line x1="940" y1="628" x2="940" y2="640" stroke="#c62828" stroke-width="2.5"/>
  <!-- switch -->
  <circle cx="940" cy="598" r="3.5" fill="#c62828"/><circle cx="940" cy="628" r="3.5" fill="#c62828"/>
  <line x1="940" y1="598" x2="958" y2="624" stroke="#1c2230" stroke-width="2.5"/>
  <text x="950" y="596" font-size="10" fill="#3a4252">ON/OFF</text>

  <!-- ===== HW-504 joystick ===== -->
  <rect x="30" y="80" width="170" height="180" fill="#ffffff" stroke="#1c2230" stroke-width="2"/>
  <text x="42" y="102" font-size="11" font-weight="700" fill="#1c2230">JOYSTICK</text>
  <text x="42" y="116" font-size="9" fill="#6b7280">HW-504</text>
  <circle cx="80" cy="190" r="34" fill="#f4f1ea" stroke="#1c2230"/>
  <circle cx="80" cy="190" r="14" fill="#e5b200" stroke="#1c2230"/>
  <g font-size="10" font-weight="600" fill="#1c2230" text-anchor="end">
    <text x="190" y="114">GND</text><text x="190" y="144">+5V</text><text x="190" y="174">VRx</text>
    <text x="190" y="204">VRy</text><text x="190" y="234">SW</text>
  </g>

  <!-- ===== Arduino Uno ===== -->
  <rect x="290" y="60" width="170" height="500" fill="#e8f1f4" stroke="#1c2230" stroke-width="2"/>
  <text x="375" y="282" font-size="14" font-weight="700" fill="#1c2230" text-anchor="middle">ARDUINO</text>
  <text x="375" y="298" font-size="12" font-weight="600" fill="#1c2230" text-anchor="middle">UNO</text>
  <circle cx="330" cy="330" r="6" fill="#1d4ed8"/>
  <text x="342" y="327" font-size="9" fill="#3a4252">built-in LED 13</text>
  <text x="342" y="339" font-size="9" fill="#3a4252">on = SLIDE mode</text>
  <g font-size="11" font-weight="600" fill="#1c2230">
    <text x="300" y="114">GND</text><text x="300" y="144">5V</text><text x="300" y="174">A0</text>
    <text x="300" y="204">A1</text><text x="300" y="234">D2</text>
    <text x="450" y="104" text-anchor="end">D5 ~</text><text x="450" y="134" text-anchor="end">D7</text><text x="450" y="164" text-anchor="end">D8</text>
    <text x="450" y="194" text-anchor="end">D6 ~</text><text x="450" y="224" text-anchor="end">D3</text><text x="450" y="254" text-anchor="end">D4</text>
    <text x="450" y="344" text-anchor="end">D9 ~</text><text x="450" y="374" text-anchor="end">D11</text><text x="450" y="404" text-anchor="end">D12</text>
    <text x="450" y="434" text-anchor="end">D10 ~</text><text x="450" y="464" text-anchor="end">A2</text><text x="450" y="494" text-anchor="end">A3</text>
    <text x="420" y="80" text-anchor="middle">5V</text><text x="375" y="550" text-anchor="middle">GND</text>
  </g>
  <g fill="#1c2230">
    <rect x="286" y="106" width="8" height="8"/><rect x="286" y="136" width="8" height="8"/><rect x="286" y="166" width="8" height="8"/>
    <rect x="286" y="196" width="8" height="8"/><rect x="286" y="226" width="8" height="8"/>
    <rect x="456" y="96" width="8" height="8"/><rect x="456" y="126" width="8" height="8"/><rect x="456" y="156" width="8" height="8"/>
    <rect x="456" y="186" width="8" height="8"/><rect x="456" y="216" width="8" height="8"/><rect x="456" y="246" width="8" height="8"/>
    <rect x="456" y="336" width="8" height="8"/><rect x="456" y="366" width="8" height="8"/><rect x="456" y="396" width="8" height="8"/>
    <rect x="456" y="426" width="8" height="8"/><rect x="456" y="456" width="8" height="8"/><rect x="456" y="486" width="8" height="8"/>
    <rect x="416" y="56" width="8" height="8"/><rect x="371" y="556" width="8" height="8"/>
  </g>

  <!-- ===== front L298N ===== -->
  <rect x="560" y="70" width="160" height="210" fill="#fdecef" stroke="#1c2230" stroke-width="2"/>
  <text x="640" y="166" font-size="13" font-weight="700" fill="#1c2230" text-anchor="middle">L298N</text>
  <text x="640" y="181" font-size="10" fill="#6b7280" text-anchor="middle">FRONT</text>
  <!-- ===== rear L298N ===== -->
  <rect x="560" y="310" width="160" height="210" fill="#fdecef" stroke="#1c2230" stroke-width="2"/>
  <text x="640" y="406" font-size="13" font-weight="700" fill="#1c2230" text-anchor="middle">L298N</text>
  <text x="640" y="421" font-size="10" fill="#6b7280" text-anchor="middle">REAR</text>
  <g font-size="10" font-weight="600" fill="#1c2230">
    <text x="568" y="104">ENA</text><text x="568" y="134">IN1</text><text x="568" y="164">IN2</text>
    <text x="568" y="194">ENB</text><text x="568" y="224">IN3</text><text x="568" y="254">IN4</text>
    <text x="712" y="104" text-anchor="end">OUT1</text><text x="712" y="134" text-anchor="end">OUT2</text>
    <text x="712" y="224" text-anchor="end">OUT3</text><text x="712" y="254" text-anchor="end">OUT4</text>
    <text x="590" y="88" text-anchor="middle">5V</text><text x="640" y="88" text-anchor="middle">12V</text><text x="690" y="88" text-anchor="middle">GND</text>
    <text x="568" y="344">ENA</text><text x="568" y="374">IN1</text><text x="568" y="404">IN2</text>
    <text x="568" y="434">ENB</text><text x="568" y="464">IN3</text><text x="568" y="494">IN4</text>
    <text x="712" y="344" text-anchor="end">OUT1</text><text x="712" y="374" text-anchor="end">OUT2</text>
    <text x="712" y="464" text-anchor="end">OUT3</text><text x="712" y="494" text-anchor="end">OUT4</text>
    <text x="640" y="512" text-anchor="middle">GND</text><text x="690" y="512" text-anchor="middle">12V</text>
  </g>
  <g fill="#1c2230">
    <rect x="556" y="96" width="8" height="8"/><rect x="556" y="126" width="8" height="8"/><rect x="556" y="156" width="8" height="8"/>
    <rect x="556" y="186" width="8" height="8"/><rect x="556" y="216" width="8" height="8"/><rect x="556" y="246" width="8" height="8"/>
    <rect x="716" y="96" width="8" height="8"/><rect x="716" y="126" width="8" height="8"/><rect x="716" y="216" width="8" height="8"/><rect x="716" y="246" width="8" height="8"/>
    <rect x="586" y="66" width="8" height="8"/><rect x="636" y="66" width="8" height="8"/><rect x="686" y="66" width="8" height="8"/>
    <rect x="556" y="336" width="8" height="8"/><rect x="556" y="366" width="8" height="8"/><rect x="556" y="396" width="8" height="8"/>
    <rect x="556" y="426" width="8" height="8"/><rect x="556" y="456" width="8" height="8"/><rect x="556" y="486" width="8" height="8"/>
    <rect x="716" y="336" width="8" height="8"/><rect x="716" y="366" width="8" height="8"/><rect x="716" y="456" width="8" height="8"/><rect x="716" y="486" width="8" height="8"/>
    <rect x="636" y="516" width="8" height="8"/><rect x="686" y="516" width="8" height="8"/>
  </g>
  <text x="640" y="296" font-size="9" fill="#6b7280" text-anchor="middle">remove ENA/ENB jumpers on both boards</text>

  <!-- ===== motors ===== -->
  <g font-size="13" font-weight="700" fill="#1c2230" text-anchor="middle">
    <circle cx="792" cy="115" r="24" fill="#ffffff" stroke="#1c2230" stroke-width="2"/><text x="792" y="120">M</text>
    <circle cx="792" cy="235" r="24" fill="#ffffff" stroke="#1c2230" stroke-width="2"/><text x="792" y="240">M</text>
    <circle cx="792" cy="355" r="24" fill="#ffffff" stroke="#1c2230" stroke-width="2"/><text x="792" y="360">M</text>
    <circle cx="792" cy="475" r="24" fill="#ffffff" stroke="#1c2230" stroke-width="2"/><text x="792" y="480">M</text>
  </g>
  <g font-size="10" fill="#3a4252">
    <text x="822" y="112">FRONT</text><text x="822" y="125">LEFT</text>
    <text x="822" y="232">FRONT</text><text x="822" y="245">RIGHT</text>
    <text x="822" y="352">REAR</text><text x="822" y="365">LEFT</text>
    <text x="822" y="472">REAR</text><text x="822" y="485">RIGHT</text>
  </g>

  <!-- ===== battery ===== -->
  <rect x="860" y="640" width="120" height="34" fill="#fff7e0" stroke="#1c2230" stroke-width="2"/>
  <text x="920" y="661" font-size="10" font-weight="600" fill="#1c2230" text-anchor="middle">BATTERY 7.4-12V</text>
  <text x="886" y="636" font-size="12" font-weight="700" fill="#1c2230">−</text>
  <text x="946" y="636" font-size="12" font-weight="700" fill="#c62828">+</text>

  <!-- ===== legend ===== -->
  <g font-size="10" fill="#3a4252">
    <line x1="30" y1="700" x2="52" y2="700" stroke="#c62828" stroke-width="3"/><text x="58" y="704">power</text>
    <line x1="120" y1="700" x2="142" y2="700" stroke="#1c2230" stroke-width="3"/><text x="148" y="704">ground</text>
    <line x1="220" y1="700" x2="242" y2="700" stroke="#1d4ed8" stroke-width="3"/><text x="248" y="704">joystick axis</text>
    <line x1="360" y1="700" x2="382" y2="700" stroke="#0e7490" stroke-width="3"/><text x="388" y="704">button</text>
    <line x1="460" y1="700" x2="482" y2="700" stroke="#c2410c" stroke-width="3"/><text x="488" y="704">motor control</text>
    <line x1="600" y1="700" x2="622" y2="700" stroke="#7c3aed" stroke-width="3"/><text x="628" y="704">motor output</text>
  </g>
</svg>
